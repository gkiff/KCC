<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC - IGCSE Interpreter</title>
    <!-- Load Tailwind CSS for layout and utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base styles and Background Setup matching your theme */
        body,
        html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #050505;
        }

        .bg-fixed-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: url('banner_logo.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Glassmorphism Effect for Content Areas */
        .glass-panel {
            background: rgba(10, 15, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(57, 255, 20, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body class="text-gray-200 antialiased selection:bg-green-500 selection:text-black relative">

    <!-- Fixed Background Image -->
    <div class="bg-fixed-fullscreen"></div>

    <!-- Main Wrapper -->
    <div class="relative z-10 min-h-screen flex flex-col items-center pb-8 pt-6">

        <!-- Main Content Area taking up most of the screen -->
        <main class="w-full max-w-7xl mx-auto px-4 flex-grow flex flex-col h-[90vh]">

            <!-- Navigation Back to Resources -->
            <div class="mb-4">
                <a href="Resources.html"
                    class="text-green-400 hover:text-yellow-300 transition-colors flex items-center gap-2 font-medium">
                    ← Back to Resources
                </a>
            </div>

            <!-- Embedded Interpreter inside a Glass Panel -->
            <div class="glass-panel rounded-3xl p-4 sm:p-6 w-full flex-grow flex flex-col">
                
                <h1 class="text-2xl sm:text-3xl font-bold mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-[#39ff14] to-[#ffff00] drop-shadow-lg text-center">
                    IGCSE Pseudocode Interpreter
                </h1>

                <!-- The iframe embedding the actual tool -->
                <div class="w-full flex-grow rounded-xl overflow-hidden border border-green-900/50 shadow-inner bg-[#111827]">
                    <iframe 
                        src="mr_kiff_s_igcse_interpreter.html" 
                        class="w-full h-full border-none" 
                        title="Mr Kiff's IGCSE Interpreter"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </main>

    </div>

</body>

</html>
